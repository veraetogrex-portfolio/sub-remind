<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T45 Remind Before the Charge — the bell leaves the charge day</title>
<link rel="stylesheet" href="_shared/nocturne.css">
<link rel="stylesheet" href="../style.css">
<style>
  /* the whole app screen from ../, in Nocturne type; no grid on the app screen */
  #stage{background:#07080C}
  #stage .sr{position:absolute;left:0;top:0;--font:var(--f-text)}
  body.autoplay #stage :focus-visible{outline:none}
  body.autoplay #li-cursor{transition:none}   /* visible from frame one, no fade at the loop seam */
  #li-cursor svg{transform:scale(1.5);transform-origin:4px 3px}   /* the hand stays readable in a phone-sized reel */
  #li-cursor.down svg{transform:scale(1.3)}
</style>
</head>
<body>
<div id="stage" data-title="T45 Remind Before the Charge" data-url="veraetogrex-portfolio.github.io/sub-remind">
  <section class="sr" aria-label="VECTOR Renew" data-assets="../assets/"></section>
</div>
<script src="_shared/stage.js"></script>
<script src="../script.js"></script>
<script>
const app = document.querySelector('.sr').renewApp;
const at = sel => { const r = Stage.rect(document.querySelector(sel)); return [r.cx, r.cy]; };
const REST = [1010, 610];
// one act: overview → Nightreel, the bell sits on the charge day → "3 days before", the bell moves to Sat 12 → Save, the push preview
Stage.init({
  reset: () => app.reset(),
  cursorStart: REST,
  async demo(s) {
    const t0 = performance.now();
    await s.until(t0, 1000);                          // the whole overview at rest first
    const [rx, ry] = at('[data-open]');
    await s.move([rx - 100, ry], 600);                // the Nightreel row, on the empty space after the name
    await s.until(t0, 1900);
    await s.click(null, { hold: 110 });               // → Nightreel: the bell stands on Tue 15 over the $15.99 tag
    await s.until(t0, 3000);
    const [ox, oy] = at('.sr-opt[data-lead="3"] input');
    await s.move([ox - 6, oy - 2], 550);              // on the left of the radio, so the hand does not cover "3 days before" and "Sat, Dec 12"
    await s.until(t0, 3800);
    await s.click(null, { hold: 120 });               // 3 days before: the bell lifts off the 15th and lands on Sat 12, 0.74 s, the bracket trails it
    await s.until(t0, 6150);                          // the camera holds the strip: bell on 12, tag on 15, "3 days to decide", 1.55 s
    const [sx, sy] = at('[data-save]');
    await s.move([sx + 120, sy - 8], 500);            // the upper right end of the button: the hand stays off "Reminder saved" and the note under it
    await s.until(t0, 6800);
    await s.click(null, { hold: 120 });               // Save reminder: "Reminder saved", the push for Sat, Dec 12 replaces the summary
    await s.until(t0, 9300);                          // close-up on the panel, then the camera pulls back to the whole screen and stops
  },
});
</script>
</body>
</html>
